[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe-audio"
version = "0.4.0"
description = "Transcripción de archivos de audio y vídeo a Markdown y subtítulos SRT, con exportación opcional a Word y otros formatos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "parmanac" }]
keywords = ["whisper", "transcription", "audio", "video", "openai", "speech-to-text"]
dependencies = [
    "faster-whisper>=1.1.1",
    "openai>=1.84.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
transcribe-audio = "transcribe_audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
